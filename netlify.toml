[build]
  command = "npm run build"
  publish = ".next"

# Configurações para redirecionar todas as rotas para o Next.js
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Configurações específicas de ambiente de produção
[context.production]
  environment = { NODE_VERSION = "18" }

# Configurações para gerenciar funções do Netlify (se necessário no futuro)
[functions]
  directory = "netlify/functions"

# Configuração de headers para maior segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://*.supabase.co https://accounts.google.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.googletagmanager.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://accounts.google.com; frame-src 'self' https://accounts.google.com;"
